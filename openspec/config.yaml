schema: spec-driven
context: |
  GetViaMe: cross-border traveller-powered shopping marketplace, Singapore-first, worldwide sourcing, future global corridors.
  Read AGENTS.md, docs/product/brief.md, owner-answers-v0.2.md, decisions.md, roadmap.md, domain-model.md, metrics.md (under docs/product), docs/engineering/architecture.md and agent-operations.md.
  Google-only auth, PWA, GCP Singapore, dev/stg/prod GHA, aggregate initial infrastructure under S$50/month.
  Inclusive 8%, S$10 minimum total job, SGD-only contract/payment/payout, no Stripe FX, MSRP optional and indicative.
  Seven-day dispute/confirmation policy; exact clock, custody, cancellation and referral conditions gated.
  Detailed specs remain draft; no feature implementation authorized by v0.2.
  Existing minimal Node HTTP shell: npm start, npm test, npm run check.
  Current behavior openspec/specs/; proposed changes openspec/changes/. Public repo: no PII, secrets or receipts.
rules:
  proposal:
    - State outcome, dependencies, non-goals, affected capabilities and decision IDs.
    - Block material unresolved decisions and external clearance.
  specs:
    - Stable requirement IDs, observable SHALL and WHEN/THEN; negative, boundary and concurrency cases.
    - Do not conflate catalogue, request, order and money states; no mandatory MSRP or provider FX.
  design:
    - State transitions, provenance, currency and rounding, rollback, cost and privacy; agent-operable evidence.
  tasks:
    - Approval/compliance gates before implementation; bounded tasks, test mapping, independent verification and archival readiness.
