schema: spec-driven
context: |
  GetViaMe is a cross-border traveller-powered shopping marketplace.
  Read AGENTS.md, docs/product/brief.md, decisions.md, roadmap.md, domain-model.md and metrics.md (under docs/product), and docs/engineering/architecture.md.
  Owner preferences: Google-only auth; GCP; Stripe Connect/PayNow; 8% fee; seven-day dispute window; environment-specific GitHub Actions.
  Detailed requirements remain draft until reviewed and approved. No product feature implementation authorized by v0.1.
  Existing app: minimal Node HTTP shell. npm start, npm test, npm run check.
  Current accepted behavior: openspec/specs/. Proposed changes: openspec/changes/.
  Public repository: no credentials, raw receipts, PII or confidential operational details.
rules:
  proposal:
    - State user outcome, dependencies, non-goals, affected capabilities and decision IDs.
    - Label unresolved decisions and block implementation where material.
  specs:
    - Use stable requirement IDs, observable SHALL statements and WHEN/THEN scenarios.
    - Cover authorization, race conditions, retries, refunds and negative cases as relevant.
    - Never assume legal or provider approval, and do not conflate product, request, order and money states.
  design:
    - Specify state transitions, interfaces, data provenance, currency/rounding, risk and rollback.
    - Include verification and metrics with privacy boundaries.
  tasks:
    - Include approval and compliance gates before implementation.
    - Use bounded tasks, requirement-to-test mapping, independent verification and archival readiness.
    - Never mark completed or archive based on draft specs alone.
