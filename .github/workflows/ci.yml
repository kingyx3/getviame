name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: npm run check
      - name: Strict OpenSpec validation (pinned CLI)
        run: npm exec --yes --package=@fission-ai/openspec@2.2.0 -- openspec validate --all --strict
